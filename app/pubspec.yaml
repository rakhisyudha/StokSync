name: stoksync
description: Offline-first multi-device inventory application.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 6.1.5
  drift: 2.28.1
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 9.2.4
  mobile_scanner: 7.0.1
  path_provider: 2.1.5
  sqlite3_flutter_libs: 0.5.34
  sync_engine:
    path: packages/sync_engine
  google_fonts: 6.3.2
  shared_preferences: 2.5.3

dev_dependencies:
  build_runner: 2.7.1
  drift_dev: 2.28.1
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
